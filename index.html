<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>

    <link rel="stylesheet" href="style.css" />
    <script src="calculator.js" defer></script>
  </head>
  <body>

    <header>
      <h1>Calculator</h1>
    </header>

    <main>
      <section class="calculator">
        <div class="displayScreen"><p id="displayText"></p></div>
          <div id="buttonContainer">
              <div><button data-value="CE"> CE </button></div>
              <div><button data-value="R"> R </button></div>
              <div><button data-value="%"> % </button></div>
              <div><button data-value="/"> / </button></div>
              <div><button data-value="7"> 7 </button></div>
              <div><button data-value="8"> 8 </button></div>
              <div><button data-value="9"> 9 </button></div>
              <div><button data-value="X"> X </button></div>
              <div><button data-value="4"> 4 </button></div>
              <div><button data-value="5"> 5 </button></div>
              <div><button data-value="6"> 6 </button></div>
              <div><button data-value="-"> - </button></div>
              <div><button data-value="1"> 1 </button></div>
              <div><button data-value="2"> 2 </button></div>
              <div><button data-value="3"> 3 </button></div>
              <div><button data-value="+"> + </button></div>
              <div><button data-value="0"> 0 </button></div>
              <div><button data-value="."> . </button></div>
              <div><button data-value="+/-"> +/- </button></div>
              <div><button data-value="="> = </button></div>
            </div>
        </div>
      </section>
      <section class="historyLog"></section>
    </main>

    <footer></footer>
  </body>
</html>
